<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planificador de viajes · Estudiantes UNL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <aside>
    <h1>Planificador de viajes</h1>
    <p class="sub">Desde la Terminal Terrestre Reina del Cisne, con horarios de las cooperativas Loja y Catamayo.</p>

    <form id="form">
      <label for="origen">Origen</label>
      <select id="origen" required></select>

      <label for="destino">Destino</label>
      <select id="destino" required></select>

      <label for="desde">Salir desde</label>
      <input id="desde" type="datetime-local" value="2026-11-02T06:30" required>

      <label for="criterio">Priorizar</label>
      <select id="criterio">
        <option value="tiempo">Menor tiempo total</option>
        <option value="espera">Menos espera entre buses</option>
        <option value="conexiones">Menos transbordos</option>
      </select>

      <button type="submit">Buscar ruta</button>
    </form>

    <div id="mensaje" role="status" aria-live="polite"></div>
    <div id="resultado"></div>
  </aside>

  <div id="mapa" aria-label="Mapa de la ruta"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
